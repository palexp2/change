<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/erp/boreal.svg" />
    <link rel="alternate icon" type="image/png" href="/erp/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boréal</title>
    <!-- Police façon Airtable (Inter) — repli sur la pile système si le CDN
         est indisponible, voir fontFamily.sans dans tailwind.config.js. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Mode nuit appliqué avant le premier rendu : évite le flash blanc.
         Même logique que client/src/lib/theme.js (clé erp.theme). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('erp.theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          if (t === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
