<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Diamètre supérieur à 1 5/16 po</title>
  <desc id="desc">Un large tuyau rond creux, vu en perspective, avec une flèche mesurant son diamètre extérieur et la mention supérieur à 1 5/16 po.</desc>
  <rect width="640" height="300" fill="#fff"/>
  <!-- Le corps et l'ouverture rendent le tuyau reconnaissable, même en miniature. -->
  <path d="M160 63 290 40a76 76 0 0 1 0 152L160 239Z" fill="#b5e2e3" stroke="#67b6bc" stroke-width="3"/>
  <path d="m206 200 116-35" fill="none" stroke="#67b6bc" stroke-width="3"/>
  <circle cx="160" cy="151" r="88" fill="#7ecdd0" stroke="#67b6bc" stroke-width="3"/>
  <circle cx="160" cy="151" r="70" fill="#355b65"/>
  <path d="M112 202a70 70 0 0 1 97-101 70 70 0 0 0-97 101Z" fill="#24434e"/>
  <!-- La cote va d'un bord extérieur à l'autre, et non sur la longueur du tube. -->
  <g fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 6">
    <path d="M72 151V27M248 151V27"/>
  </g>
  <g fill="none" stroke="#22a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M72 32H248m-162-9-14 9 14 9m148-18 14 9-14 9"/>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">
    <text x="486" y="130" font-size="72" fill="#22a34a">&gt;</text>
    <text x="486" y="184" font-size="40" fill="#475569">1 5/16 po</text>
  </g>
  <rect y="289" width="640" height="7" rx="3.5" fill="#22a34a"/>
</svg>
