<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pont de session Orisha</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { max-width: 460px; margin: 32px auto; padding: 0 16px; color: #0f172a; }
  @media (prefers-color-scheme: dark) { body { color: #e2e8f0; background: #0f172a; } }
  h1 { font-size: 16px; }
  label { display: block; font-size: 12px; opacity: .7; margin: 14px 0 4px; }
  input { width: 100%; padding: 8px 10px; font-size: 13px; border: 1px solid rgba(100,116,139,.4);
          border-radius: 8px; background: transparent; color: inherit; box-sizing: border-box; }
  button { margin-top: 16px; padding: 8px 14px; font-size: 13px; font-weight: 600; border: 0;
           border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
  p { font-size: 12px; opacity: .7; line-height: 1.5; }
  #saved { font-size: 12px; color: #059669; margin-left: 10px; }
</style>
</head>
<body>
  <h1>Pont de session Orisha</h1>
  <p>Le jeton se copie depuis l'ERP : onglet Collecte → bouton « Jeton » (à côté de « Module de navigateur »).</p>
  <label for="erpUrl">Adresse de l'ERP</label>
  <input id="erpUrl" placeholder="https://customer.orisha.io" autocomplete="off">
  <label for="token">Jeton</label>
  <input id="token" type="password" autocomplete="off">
  <label style="display:flex;align-items:center;gap:8px;margin-top:16px;font-size:13px;opacity:1">
    <input type="checkbox" id="auto" style="width:auto">
    Envoyer mes sessions automatiquement dès que je me connecte à un portail
  </label>
  <button id="save">Enregistrer</button><span id="saved" role="status"></span>
</body>
<script type="module" src="options.js"></script>
</html>
