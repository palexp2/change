<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courriel — commande créée</title>
<style>
:root{font-family:Inter,-apple-system,"Segoe UI",sans-serif;color:#302c25;background:#f6f3ed;font-size:14px}
*{box-sizing:border-box}body{margin:0}
.wrap{max-width:780px;margin:auto;padding:24px 16px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:20px;margin:0}
.seg{display:flex;border:1px solid #e7e2d9;border-radius:8px;overflow:hidden}
.seg button{white-space:nowrap;border:0;background:#fff;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:#167030;color:#fff}
.env{background:#fff;border:1px solid #e7e2d9;border-radius:8px 8px 0 0;padding:12px 16px;font-size:13px;line-height:1.7}
.env b{display:inline-block;width:52px;color:#756e62;font-weight:500}
.mail{border:1px solid #e7e2d9;border-top:0;border-radius:0 0 8px 8px;overflow:hidden}
</style>
</head>
<body><div class="wrap">
<div class="bar"><h1>Courriel de commande</h1>
<div style="display:flex;gap:8px"><div class="seg"><button id="bsys" class="on" onclick="setKind('sys')">Avec contrôleur</button><button id="bpie" onclick="setKind('pie')">Pièces / remplacement</button></div>
<div class="seg"><button id="bfr" class="on" onclick="show('fr')">FR</button><button id="ben" onclick="show('en')">EN</button></div></div></div>
<div class="env" id="env"></div>
<div class="mail" id="mail"></div>
</div>
<script>
const T={
fr:{to:'Mélanie Lamontagne &lt;info@fredlamontagne.com&gt;',addr:'Fred Lamontagne<br>356 Chemin du Sommet Est<br>Rimouski, QC G5N 1V1',
subject:"Rends ton installation facile et rapide",
m1:`<h1 style="padding-bottom:20px;font-size:1.17em"><strong>Ton système Orisha arrive d’ici une semaine</strong></h1><p>Voici l’<strong>adresse prévue pour la livraison</strong>; fais-nous signe si ce n’est pas la bonne.</p>`,
m2:`<p style="margin-top:40px"><strong>Quoi faire dès aujourd'hui?</strong></p><p>Sauve-toi du temps et pas mal de trouble en préparant ces points:</p><ul>
<li style="margin-left:15px"><p>Préparer ton <strong>panneau de plywood</strong> d'un minimum de 4'x4'.</p></li>
<li style="margin-left:15px"><p>Assure-toi d’avoir une <strong>prise électrique</strong>&nbsp;disponible d’au moins <strong>5&nbsp;ampères</strong>.</p></li>
<li style="margin-left:15px"><p>Choisis <strong>l’emplacement</strong> de ton <strong>cerveau Orisha</strong> (le contrôleur central), là où il y a du <strong>Wi-Fi stable</strong>. Il doit être à moins de 250 pieds de la serre.</p></li>
<li style="margin-left:15px"><p>Achète ta <strong>pôle</strong> d'un minimum (1pouce x 6pieds) pour installer ta <strong>station météo</strong>.</p></li></ul><p>Ça devrait ressembler à ça une fois l’installation terminée:</p>`,
tools:"Prépare aussi ces outils; c’est ce qui risque de te manquer et qui n’est pas dans la boîte.",
img:"https://orisha.us-east-1.linodeobjects.com/email_onboarding%2Ffr%2Foutils-side-vent.jpg",
help:`<p style="margin-bottom:7px;font-size:16px;color:#333">On est toujours là pour t’aider, soit par <a href="https://app.orisha.io/#aide">l'app d’aide Orisha</a>,</p><p style="margin-top:0;font-size:16px;color:#333">soit par téléphone 📞 <a href="tel:1-888-267-4742" style="color:#777">1-888-267-4742</a></p>`},
en:{to:'Micheal Newburg &lt;fallsbrookorganic@gmail.com&gt;',addr:'Falls Brook Organic Farm<br>116 Sterling City Rd<br>Lyme, CT 06371, USA',
subject:"Your installation, quick and easy",
m1:`<h1 style="padding-bottom:20px;font-size:1.17em"><strong>Your Orisha system will be here in a week</strong></h1><p>This is the <strong>shipping address</strong> we have on file, let us know if it isn't accurate.</p>`,
m2:`<p style="margin-top:40px"><strong>What can you get out of the way today?</strong></p><p>Save yourself some time and a whole lot of trouble by taking care of these:</p><ul>
<li style="margin-left:15px"><p>Prepare your 4'x4' <strong>plywood panel</strong>.</p></li>
<li style="margin-left:15px"><p>Make sure you have an available <strong>electric outlet</strong>&nbsp;of at least <strong>5&nbsp;amperes</strong>.</p></li>
<li style="margin-left:15px"><p>Choose the <strong>location</strong> of your <strong>Orisha's brain</strong> (the central controller), where the <strong>Wi-Fi is stable</strong>. It must be within 250 feet of your tunnel.</p></li>
<li style="margin-left:15px"><p>Buy your <strong>pole</strong> of at least (1 inch x 6 feet) to install your <strong>weather station</strong> on.</p></li></ul><p>It should look a little like this once your installation is completed:</p>`,
tools:"Make sure you have these tools on hand: you won't find them in the box.",
img:"https://orisha.us-east-1.linodeobjects.com/email_onboarding%2Fen%2Ftools-rollup.jpg",
help:`<p style="margin-bottom:7px;font-size:16px;color:#333">We're always here to help, either with <a href="https://app.orisha.io/#aide">Orisha's assistance app</a>,</p><p style="margin-top:0;font-size:16px;color:#333">or one call away at 📞 <a href="tel:1-888-267-4742" style="color:#777">1-888-267-4742</a></p>`}};
let kind='sys',lang='fr';function setKind(k){kind=k;show(lang)}
const P={fr:{subject:"Ta commande Orisha : on vérifie l'adresse",h:"Ta commande Orisha est en préparation",p:"Voici l’<strong>adresse prévue pour la livraison</strong>; fais-nous signe si ce n’est pas la bonne."},
en:{subject:"Your Orisha order: confirming the address",h:"Your Orisha order is being prepared",p:"This is the <strong>shipping address</strong> we have on file, let us know if it isn't accurate."}};
function show(l){lang=l;const t=T[l];
bsys.className=kind==='sys'?'on':'';bpie.className=kind==='pie'?'on':'';
if(kind==='pie'){const q=P[l];
env.innerHTML=`<div><b>De</b>info@orisha.io</div><div><b>À</b>${t.to}</div><div><b>Objet</b><strong>${q.subject}</strong></div>`;
mail.innerHTML=`<table width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f4;font-family:Arial,sans-serif"><tr><td align="center">
<table width="600" cellspacing="0" cellpadding="0" style="background:#fff;max-width:100%">
<tr><td align="center" style="padding:20px"><img src="https://orisha.us-east-1.linodeobjects.com/logo.png" alt="Orisha" style="max-width:150px;display:block"></td></tr>
<tr><td style="background:#22b14c;height:5px;line-height:5px;font-size:0"></td></tr>
<tr><td style="padding:20px;color:#333"><h1 style="padding-bottom:20px;font-size:1.17em"><strong>${q.h}</strong></h1><p>${q.p}</p><p style="margin:20px 0 20px;font-size:16px"><strong>${t.addr}</strong></p></td></tr>
<tr><td style="padding:20px;text-align:center">${t.help}</td></tr>
<tr><td align="center" style="padding:20px;background:#f4f4f4;font-size:12px;color:#777">Automatisation Orisha Inc. 1535 ch. Ste-Foy Bureau 220 Québec, QC G1S 2P1</td></tr>
</table></td></tr></table>`;return}
bfr.className=l==='fr'?'on':'';ben.className=l==='en'?'on':'';
env.innerHTML=`<div><b>De</b>info@orisha.io</div><div><b>À</b>${t.to}</div><div><b>Objet</b><strong>${t.subject}</strong></div>`;
mail.innerHTML=`<table width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f4;font-family:Arial,sans-serif"><tr><td align="center">
<table width="600" cellspacing="0" cellpadding="0" style="background:#fff;max-width:100%">
<tr><td align="center" style="padding:20px"><img src="https://orisha.us-east-1.linodeobjects.com/logo.png" alt="Orisha" style="max-width:150px;display:block"></td></tr>
<tr><td style="background:#22b14c;height:5px;line-height:5px;font-size:0"></td></tr>
<tr><td style="padding:20px;color:#333">${t.m1}<p style="margin:20px 0 40px;font-size:16px"><strong>${t.addr}</strong></p><hr>${t.m2}
<img src="https://orisha.us-east-1.linodeobjects.com/email_onboarding%2Fgreenhouse-overview.png" width="473" style="max-width:100%;height:auto">
<img src="https://orisha.us-east-1.linodeobjects.com/email_onboarding%2Fplywood-overview.jpeg" width="100%">
<hr style="margin:50px 0"><h3><strong>${t.tools}</strong></h3><img src="${t.img}" width="100%"></td></tr>
<tr><td style="padding:20px;text-align:center">${t.help}</td></tr>
<tr><td align="center" style="padding:20px;background:#f4f4f4;font-size:12px;color:#777">Automatisation Orisha Inc. 1535 ch. Ste-Foy Bureau 220 Québec, QC G1S 2P1</td></tr>
</table></td></tr></table>`}
show('fr');
</script>
</body></html>
