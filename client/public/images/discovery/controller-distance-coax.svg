<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title description">
  <title id="title">Distance au contrôleur central — 350 pi</title>
  <desc id="description">Une antenne reliée au contrôleur existant par un câble coaxial permet de rejoindre la serre à 350 pi.</desc>
