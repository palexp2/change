<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { width: 320px; margin: 0; padding: 14px; background: #fff; color: #0f172a; }
  @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #e2e8f0; } }
  h1 { font-size: 13px; font-weight: 600; margin: 0 0 10px; }
  button { width: 100%; padding: 9px 12px; font-size: 13px; font-weight: 600; border: 0; border-radius: 8px;
           background: #2563eb; color: #fff; cursor: pointer; }
  button[disabled] { opacity: .55; cursor: default; }
  ul { list-style: none; margin: 12px 0 0; padding: 0; font-size: 12px; }
  li { display: flex; gap: 6px; padding: 4px 0; border-bottom: 1px solid rgba(100,116,139,.18); }
  li:last-child { border: 0; }
  .n { flex: 1; }
  .d { opacity: .65; font-size: 11px; }
  .ok { color: #059669; } .absent { color: #b45309; } .erreur { color: #dc2626; }
  #doc { background: #059669; margin-bottom: 4px; }
  #docOut { margin: 0 0 14px; min-height: 14px; font-size: 11px; }
  #docOut a { opacity: 1; font-weight: 600; }
  a { font-size: 11px; opacity: .7; color: inherit; }
</style>
</head>
<body>
  <button id="doc">Envoyer ce document à l’extracteur</button>
  <p id="docOut" class="d"></p>
  <h1>Tout récolter</h1>
  <button id="go">Envoyer mes sessions et collecter</button>
  <ul id="out"></ul>
  <p><a href="#" id="opts">Réglages</a></p>
  <script src="popup.js"></script>
</body>
</html>
