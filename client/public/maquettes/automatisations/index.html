<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Automatisations</title>
<style>
:root{--brand:#1a5c2a;--b2:#25b14e;--bg:#f8fafc;--line:#e2e8f0;--mut:#64748b;--ink:#1f2937;--card:#fff;--sel:#eef6f0}
*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);height:100vh;display:flex;flex-direction:column}
.top{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:#fff}
.tog{width:34px;height:18px;border-radius:9px;background:#cbd5e1;position:relative;cursor:pointer;flex:none}.tog:after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}.tog.on{background:var(--b2)}.tog.on:after{left:18px}
.top .t{font-weight:600}.sp{flex:1}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.main{flex:1;display:flex;min-height:0}
.list{width:340px;border-right:1px solid var(--line);background:#fff;overflow:auto;flex:none}
.list .srch{margin:12px;width:calc(100% - 24px);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px}
.gh{display:flex;justify-content:space-between;padding:12px 16px 6px;font-weight:600;font-size:13px;cursor:pointer}.gh span{color:var(--mut);font-weight:400}
.it{display:flex;gap:10px;padding:9px 16px;cursor:pointer;border-radius:8px;margin:0 6px}.it:hover{background:#f1f5f9}.it.s{background:var(--sel)}
.it .n{flex:1;min-width:0}.it .n b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .n i{font-style:normal;color:var(--mut);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;height:16px;flex:none;margin-top:2px}.pill.on{background:#dcfce7;color:#15803d}.pill.off{background:#f1f5f9;color:#94a3b8}
.canvas{flex:1;overflow:auto;padding:40px 24px;background:radial-gradient(#e2e8f0 1px,transparent 1px) 0 0/18px 18px}
.flow{max-width:440px;margin:0 auto;position:relative}
.lbl{font-size:11px;letter-spacing:.08em;color:var(--mut);font-weight:600;margin:0 0 8px}
.blk{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer}
.blk.s{border:2px solid var(--brand);padding:11px 13px}
.ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:17px;flex:none}
.blk b{display:block;font-weight:500}.blk i{font-style:normal;color:var(--mut);font-size:12px}
.wire{width:2px;height:22px;background:#cbd5e1;margin:0 0 0 30px}
.add{display:inline-flex;margin:4px 0 0 18px;border:1px dashed #94a3b8;border-radius:8px;padding:5px 10px;font-size:12px;color:var(--mut);cursor:pointer;background:#fff}
.props{width:360px;border-left:1px solid var(--line);background:#fff;overflow:auto;flex:none}
.sec{padding:16px;border-bottom:1px solid var(--line)}.sec h4{margin:0 0 12px;font-size:11px;letter-spacing:.08em;color:var(--mut)}
.f{margin-bottom:12px}.f label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}.f .v{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;background:#fff}
.chip{display:inline-block;background:#e0f2e7;color:var(--brand);border-radius:5px;padding:1px 6px;font-size:12px}
select.v,input.v{width:100%;font:inherit;font-size:13px}.cr{display:grid;grid-template-columns:1fr 1fr 1fr 20px;gap:6px;margin-bottom:6px;align-items:center}.cr .v{padding:6px 7px}.x{cursor:pointer;color:var(--mut);text-align:center}.lk{color:var(--brand);font-size:13px;cursor:pointer}.note{font-size:12px;color:var(--mut);margin-top:-4px}
textarea.v{resize:vertical}.code{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.tok{display:flex;flex-wrap:wrap;gap:4px}.tok .chip{cursor:pointer}.mv{display:flex;gap:6px}.btn:disabled{opacity:.4}.del{color:#b91c1c}
.grip{color:#cbd5e1;cursor:grab;font-size:12px;letter-spacing:-2px}.blk.drag{opacity:.4}.blk.over{border-color:var(--b2);box-shadow:0 -3px 0 var(--b2)}
.addw{position:relative;display:inline-block}.menu{position:absolute;top:34px;left:18px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.1);padding:6px;width:260px;z-index:5}
.mi{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:13px}.mi:hover{background:#f1f5f9}.ic.sm{width:26px;height:26px;font-size:13px;border-radius:6px}
.blk i{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist{display:none}.hist.o{display:block}.row{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px solid #f1f5f9}.ok{color:#15803d}.ko{color:#b91c1c}
.rz{width:6px;margin:0 -3px;cursor:col-resize;flex:none;position:relative;z-index:2}.rz:hover,.rz.d{background:var(--b2)}
@media (max-width:900px){.props{display:none}.list{width:260px}}
@media (max-width:600px){.list{display:none}}
</style></head><body>
<div class="top"><div class="tog" id="tg"></div><div class="t" id="tt"></div><div class="sp"></div><button class="btn" id="hb">Historique</button><button class="btn">Tester</button><button class="btn pri">+ Nouvelle</button></div>
<div class="main">

<div class="rz" data-p="r"></div><div class="props" id="pp"></div>
</div>
<script>
const A=[{"id": "sys_stripe_invoice_paid", "n": "Stripe invoice.paid → Facture", "on": 1, "g": "Ventes", "d": "À la réception d'un webhook Stripe invoice.paid, la table factures est mise à jour (status='Payé', total), rattachée à son entreprise (client Stripe, abonnement"}, {"id": "sys_shipment_tracking_email", "n": "Envoi email de suivi (Postmark)", "on": 1, "g": "Expédition & retours", "d": "Envoie un email bilingue (FR/EN selon la langue du contact) contenant le lien de suivi du transporteur"}, {"id": "sys_stripe_batch_factures_sync", "n": "Batch Stripe → Factures (sync complet)", "on": 1, "g": "Comptabilité", "d": "Récupère toutes les factures depuis Stripe via l'API list, puis UPSERT chacune dans la table factures (status, total, devise, date, numéro, subscription liée, c"}, {"id": "sys_airtable_webhook_router", "n": "Router webhooks Airtable", "on": 1, "g": "Système", "d": "À chaque ping webhook d'Airtable, récupère les payloads (modifications/créations/suppressions) via l'API, groupe les changements par table puis par module, et d"}, {"id": "sys_gmail_sync", "n": "Sync Gmail (3 min)", "on": 1, "g": "Système", "d": "Synchronise toutes les boîtes Gmail connectées (via OAuth) : récupère les nouveaux messages, les associe aux contacts/entreprises, crée des interactions + email"}, {"id": "sys_airtable_fallback_sync", "n": "Fallback sync Airtable (24h)", "on": 1, "g": "Système", "d": "Resync complet de tous les modules Airtable (projets, pièces, commandes, billets, serials, envois, soumissions, retours, adresses, BOM, assemblages, factures, s"}, {"id": "sys_airtable_token_refresh", "n": "Refresh proactif token Airtable (10min)", "on": 1, "g": "Système", "d": "Vérifie toutes les 10 minutes si le token OAuth Airtable expire dans moins de 15 minutes"}, {"id": "sys_airtable_webhooks_init", "n": "Enregistrement webhooks Airtable (boot)", "on": 1, "g": "Système", "d": "Au démarrage du serveur (+5s), enregistre les webhooks Airtable côté API Airtable pour les bases/tables configurées"}, {"id": "sys_installation_followup", "n": "Email de suivi d'installation (J+21)", "on": 0, "g": "Système", "d": "Envoie un email bilingue aux nouveaux clients 21 jours après le premier envoi de leur commande"}, {"id": "sys_stripe_charge_refunded", "n": "Stripe charge.refunded → Facture (Remboursement)", "on": 1, "g": "Ventes", "d": "À la réception d'un webhook Stripe charge.refunded, une ligne est créée dans la table factures pour chaque refund avec succès (status='Remboursement', sync_sour"}, {"id": "sys_stripe_refunds_backfill", "n": "Backfill remboursements Stripe → Factures", "on": 1, "g": "Ventes", "d": "Parcourt tous les stripe_balance_transactions de type 'refund'/'payment_refund' déjà synchronisés, et insère pour chacun une facture (status='Remboursement', sy"}, {"id": "sys_stripe_bulk_bt_sync", "n": "Sync balance_transactions sur tous les payouts", "on": 1, "g": "Comptabilité", "d": "Itère tous les stripe_payouts qui n'ont pas encore de balance_transactions synchronisés, et appelle syncStripeBalanceTransactions pour chacun"}, {"id": "sys_stripe_weekly_payout_push", "n": "Comptabilisation QB des Stripe payouts (quotidienne)", "on": 1, "g": "Comptabilité", "d": "Deux passages par jour (8h et 18h, heure de Montréal) : pull incrémental des nouveaux Stripe payouts, sync des balance_transactions manquantes, puis push automa"}, {"id": "sys_revenue_recognition", "n": "Constat de vente à l'expédition (Dr 23900|AR / Cr 40000)", "on": 1, "g": "Comptabilité", "d": "Quand un envoi satisfait la condition configurée (défaut : status = « Envoyé »), le revenu des factures kind='order' liées à la commande est constaté en QB (Jou"}, {"id": "sys_ctb_programmation_paiement", "n": "CTB - Suivi : programmation des factures à payer (Google Sheets)", "on": 0, "g": "Comptabilité", "d": "Quand une facture à payer est ajoutée dans l'ERP — reçu publié sur QuickBooks en type « Facture (Bill) », achat fournisseur de type facture créé à la main ou pu"}, {"id": "sys_treasury_alert", "n": "Trésorerie BNC : alerte solde projeté sous le seuil", "on": 1, "g": "Banque", "d": "Chaque matin (7h30) et à chaque saisie du solde disponible réel (page Trésorerie), projette le solde du compte BNC CAD sur l'horizon configuré : solde saisi + p"}, {"id": "sys_paie_repartition", "n": "Paie : écriture de répartition par département (QuickBooks)", "on": 1, "g": "Comptabilité", "d": "Génère l'écriture de journal qui répartit chaque paie entre les départements, selon le processus de l'onglet Salaires du fichier CTB - Suivi : base = total de l"}, {"id": "sys_card_payment_reminder", "n": "Rappel mensuel : payer les cartes (Visa CAD / Visa USD)", "on": 1, "g": "Banque", "d": "Rappelle chaque mois de payer les soldes des cartes de crédit avant la date cible (défaut : le 24 — l'échéance réelle des cartes est vers le 26-27, la cible gar"}, {"id": "sys_month_end_provisions", "n": "Écritures de fin de mois : préparation des provisions", "on": 1, "g": "Comptabilité", "d": "Le 1er de chaque mois, prépare la clôture du mois écoulé — les étapes mécaniques des procédures « Provision - Subv"}, {"id": "sys_work_suggestions", "n": "Travaux : suggestions de chantiers et d'intégrations par l'agent", "on": 1, "g": "Système", "d": "Chaque matin, l'agent propose jusqu'à 5 prochains chantiers dans l'onglet « Suggestions » de la page Travaux — liste distincte de la file de prompts de l'utilis"}, {"id": "sys_treasury_solde_sheet", "n": "Trésorerie BNC : ancien import du Sheet (remplacé par le miroir Boréal)", "on": 0, "g": "Banque", "d": "Ancien import du Google Sheet vers Boréal"}, {"id": "sys_marketing_expense_sync", "n": "Budget marketing : détection des dépenses (QuickBooks)", "on": 1, "g": "Comptabilité", "d": "Automatise la détection de la procédure « Suivi - Budget marketing (Émilie) » : plusieurs fois par jour (aux 3 heures, de 6h30 à 18h30 à Montréal), le rapport G"}, {"id": "sys_marketing_weekly_slack", "n": "Budget marketing : message Slack hebdomadaire à Émilie", "on": 0, "g": "Comptabilité", "d": "Chaque mardi (jour configurable), envoie à Émilie un message Slack court et clair listant les dépenses marketing validées « pertinentes » depuis le dernier envo"}, {"id": "sys_pieces_disbursements", "n": "Déboursés mensuels en pièces : calcul, fichier Drive et message à Guillaume", "on": 1, "g": "Comptabilité", "d": "Le 7 de chaque mois (9 h, Montréal), exécute la procédure « Pièces_Déboursés » sur le mois qui vient de se terminer"}, {"id": "sys_fiscal_anomalies_sheet", "n": "Statut fiscal : sync des anomalies TPS/TVQ du mentor vers les profils fournisseurs", "on": 1, "g": "Comptabilité", "d": "Deux fois par jour, lit l'onglet « Fournisseurs_TPS_TVQ_Anomalies » du Google Sheet « Sommaire_Statut fiscal des taxes » — le journal de corrections tenu par le"}, {"id": "sys_carm_balance_alert", "n": "Douanes ASFC : alerte de solde bas du compte CARM", "on": 1, "g": "Banque", "d": "Chaque matin (8h) et après chaque import de relevé, calcule le solde du compte CARM de l'ASFC — solde d'ouverture saisi + paiements − évaluations, intérêts et p"}, {"id": "sys_treasury_qb_clear", "n": "Paiements émis : détection du « passé à la banque » via QuickBooks", "on": 1, "g": "Banque", "d": "Toutes les heures (et sur demande depuis le bouton « Synchroniser avec QuickBooks » de la page Paiements émis), lit le grand livre QuickBooks du compte bancaire"}, {"id": "sys_instagram_prospect_intake", "n": "Prospects Instagram : réception des commentaires (ManyChat)", "on": 1, "g": "Instagram", "d": "Reçoit les appels de ManyChat sur POST /api/instagram/manychat (action « External Request », réservée au forfait Pro de ManyChat) et tient la liste des prospect"}, {"id": "sys_instagram_weekly_slack", "n": "Prospects Instagram : liste hebdomadaire à Philippe (Slack)", "on": 1, "g": "Instagram", "d": "Juste après la reconnexion d'Instagram (le samedi), et seulement si la lecture des commentaires a réussi, envoie à Philippe la liste des prospects Instagram cap"}, {"id": "sys_pmt_suivi_sheet", "n": "Paiements émis : reprise de l'onglet Pmt_Suivi (fichier CTB - Suivi)", "on": 1, "g": "Banque", "d": "Toutes les 30 minutes (et sur demande via le bouton « Synchroniser la feuille » de la page Paiements émis), relit l'onglet « Pmt_Suivi » du Google Sheet « CTB -"}, {"id": "sys_instagram_comment_scrape", "n": "Prospects Instagram : lecture des commentaires", "on": 1, "g": "Instagram", "d": "Chaque nuit de dimanche à lundi à minuit (heure de Montréal), relit les commentaires des publications récentes des comptes configurés et enregistre TOUS les com"}, {"id": "sys_invoice_collection", "n": "Collecte des factures fournisseurs sur leurs portails", "on": 1, "g": "Comptabilité", "d": "Chaque nuit à 5 h (heure de Montréal), pour chaque compte de la page « Collecte de factures » : part des transactions bancaires NON COMPTABILISÉES (statut « à t"}, {"id": "sys_ticket_survey_slack", "n": "Sondage de satisfaction : alerte Slack à Philippe", "on": 1, "g": "Système", "d": "Quand un client répond au sondage de satisfaction envoyé par SMS depuis la fiche d'un billet, envoie une alerte Slack — mais SEULEMENT sur les cas actionnables"}, {"id": "sys_address_check", "n": "Vérification des adresses postales + notification des adresses fautives", "on": 1, "g": "Expédition & retours", "d": "Chaque adresse postale qui entre dans l'ERP est contrôlée à l'écriture, QUELLE QUE SOIT SON ORIGINE : saisie sur la fiche entreprise, appel de qualification, fo"}, {"id": "sys_return_label", "n": "Étiquette de retour (RMA) — achat Novoxpress", "on": 1, "g": "Expédition & retours", "d": "Depuis une fiche Retour, achète une étiquette de retour Novoxpress (le client expédie, Orisha reçoit — l'inverse d'un envoi sortant)"}, {"id": "sys_return_instructions_email", "n": "Instructions de retour au client (Gmail)", "on": 1, "g": "Expédition & retours", "d": "Envoie l'un des 6 templates HubSpot réels (US/CAN-FR/CAN-EN × immédiat/différé — sélection par pays, langue du contact et raison du retour) avec l'étiquette de "}, {"id": "sys_digikey_orders", "n": "DigiKey : commandes et factures rapatriées par l’API", "on": 1, "g": "Comptabilité", "d": "Chaque jour à 6 h (heure de Montréal), interroge l’API DigiKey (historique des commandes puis détail de chacune) sur les lookback_days derniers jours et, pour c"}, {"id": "sys_card_ceiling_alert", "n": "Plafond des cartes de crédit (MasterCard BNC)", "on": 1, "g": "Banque", "d": "Surveille la PLACE qui reste sur les cartes de crédit d'opération — question distincte du rappel « payer les cartes » ci-dessus, qui reste actif : la Mastercard"}, {"id": "sys_return_bulk_by_company", "n": "Retourner tous les numéros de série (import Airtable #3)", "on": 1, "g": "Expédition & retours", "d": "Depuis la fiche entreprise, sélectionne des numéros de série dans le tableau et choisit une raison de retour : crée un dossier de retour (returns) + un item de "}, {"id": "sys_return_item_created", "n": "Création d'un item de retour (import Airtable #2)", "on": 1, "g": "Expédition & retours", "d": "Dès qu'un item de retour est créé (quelle qu'en soit l'origine — bouton retour, retour en masse, sync Airtable), passe le numéro de série lié au statut « En ret"}, {"id": "sys_return_item_received", "n": "Réception d'un retour (import Airtable #5 + #6)", "on": 1, "g": "Expédition & retours", "d": "Quand un item de retour est marqué reçu (date + réceptionniste renseignés), écrit les instructions au réceptionniste et met à jour le statut du numéro de série "}, {"id": "sys_ups_return_label", "n": "Étiquette de retour (RMA) — achat UPS", "on": 1, "g": "Expédition & retours", "d": "Depuis une fiche Retour, achète une étiquette de retour directement chez UPS (Shipping API, ReturnService code 9 « Print Return Label ») : l'adresse du client e"}, {"id": "sys_ups_return_label_email", "n": "Étiquette de retour UPS au client (Postmark)", "on": 1, "g": "Expédition & retours", "d": "Envoie au client l'étiquette de retour UPS en pièce jointe PDF"} pp.querySelectorAll('[data-tok]').forEach(e=>e.onmousedown=ev=>{ev.preventDefault();const f=lastF&&pp.contains(lastF)&&lastF.tagName!=='SELECT'?lastF:pp.querySelector('input[data-f],textarea[data-f]');if(!f)return;const s=f.selectionStart??f.value.length;f.value=f.value.slice(0,s)+'{'+e.dataset.tok+'}'+f.value.slice(f.selectionEnd??s);x.v[f.dataset.f]=f.value;f.focus();paint()});
const mv=d=>{L.splice(i+d,0,L.splice(i,1)[0]);step+=d;render()};
pp.querySelector('[data-up]').onclick=()=>mv(-1);pp.querySelector('[data-dn]').onclick=()=>mv(1);
pp.querySelector('[data-del]').onclick=()=>{L.splice(i,1);step=0;render()}}
let dragI=null;
function paint(){const t=tSum(trig(sel)),L=acts(sel);
let h=`<div class="lbl">DÉCLENCHEUR</div><div class="blk${step===0?' s':''}" data-s="0"><div class="ic" style="background:#e0f2e7">${t[0]}</div><div><b>${esc(t[1])}</b><i>${esc(t[2])}</i></div></div><div class="wire"></div><div class="lbl">ACTIONS</div>`;
L.forEach((x,i)=>{const s=aSum(x);h+=(i?'<div class="wire"></div>':'')+`<div class="blk${step===i+1?' s':''}" data-s="${i+1}" draggable="true" data-i="${i}"><span class="grip">⋮⋮</span><div class="ic" style="background:${BLOCKS[x.t].bg}">${s[0]}</div><div style="min-width:0"><b>${s[1]}</b><i>${esc(s[2])}</i></div></div>`});
h+=`${L.length?'<div class="wire"></div>':''}<div class="addw"><div class="add" id="addA">+ Action</div>${menu?`<div class="menu">${Object.entries(BLOCKS).map(([k,o])=>`<div class="mi" data-add="${k}"><span class="ic sm" style="background:${o.bg}">${o.ic}</span>${o.n}</div>`).join('')}</div>`:''}</div>`;
const fl=document.getElementById('fl');fl.innerHTML=h;
fl.querySelectorAll('.blk').forEach(e=>e.onclick=()=>{step=+e.dataset.s;hist=false;menu=false;render()});
fl.querySelector('#addA').onclick=ev=>{ev.stopPropagation();menu=!menu;paint()};
fl.querySelectorAll('[data-add]').forEach(e=>e.onclick=()=>{L.push({t:e.dataset.add,v:dflt(e.dataset.add)});menu=false;step=L.length;render()});
fl.querySelectorAll('[draggable]').forEach(e=>{e.ondragstart=()=>{dragI=+e.dataset.i;e.classList.add('drag')};e.ondragend=()=>e.classList.remove('drag');
e.ondragover=ev=>{ev.preventDefault();e.classList.add('over')};e.ondragleave=()=>e.classList.remove('over');
e.ondrop=ev=>{ev.preventDefault();const to=+e.dataset.i;if(dragI===null||dragI===to)return;const m=L.splice(dragI,1)[0];L.splice(to,0,m);if(step===dragI+1)step=to+1;dragI=null;render()}});
list()}
function render(){document.getElementById('tt').textContent=sel.n;document.getElementById('tg').className='tog'+(sel.on?' on':'');
const L=acts(sel);if(step>L.length)step=0;
const pp=document.getElementById('pp');
pp.innerHTML=hist?`<div class="sec"><h4>HISTORIQUE</h4>${[['09 oct. 14:02',1],['09 oct. 11:40',1],['08 oct. 16:15',0],['08 oct. 09:01',1],['07 oct. 13:22',1]].map(r=>`<div class="row"><span>${r[0]}</span><span class="${r[1]?'ok':'ko'}">${r[1]?'Réussi':'Échec'}</span></div>`).join('')}</div>`
:step===0?trigEditor(trig(sel)):actEditor(L[step-1],step-1,L.length);
if(!hist)step===0?wireTrig(trig(sel)):wireAct(L[step-1],step-1);paint()}
document.getElementById('q').oninput=list;
document.getElementById('hb').onclick=()=>{hist=!hist;render()};
document.getElementById('tg').onclick=()=>{sel.on=sel.on?0:1;render()};
document.addEventListener('click',e=>{if(menu&&!e.target.closest('.addw')){menu=false;paint()}});
render();

// Largeur des panneaux : glisser la poignée, mémorisée.
function W(k,v){try{v?localStorage.setItem('aw_'+k,v):0;return localStorage.getItem('aw_'+k)}catch{return null}}
const PN={l:document.querySelector('.list'),r:document.getElementById('pp')};
for(const k in PN){const w=W(k);if(w)PN[k].style.width=w+'px'}
document.querySelectorAll('.rz').forEach(z=>z.onmousedown=e=>{e.preventDefault();const k=z.dataset.p,el=PN[k],x0=e.clientX,w0=el.offsetWidth;z.classList.add('d');document.body.style.cursor='col-resize';
const mv=ev=>{const d=ev.clientX-x0;el.style.width=Math.min(640,Math.max(200,k==='l'?w0+d:w0-d))+'px'};
const up=()=>{z.classList.remove('d');document.body.style.cursor='';W(k,el.offsetWidth);removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};
addEventListener('mousemove',mv);addEventListener('mouseup',up)});
</script></body></html>
